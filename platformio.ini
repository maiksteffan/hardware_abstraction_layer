; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================================
; Active board selection
;   Change `default_envs` to switch which board is built/uploaded by default,
;   or pick one explicitly with:  pio run -e <env>  /  pio run -e <env> -t upload
; ============================================================================
[platformio]
default_envs = esp32-s3-devkitc-1

; ---- Settings shared by every board ----
[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0

; ============================================================================
; NEW BOARD — ESP32-S3-DevKitC-1-N8R8 (module: ESP32-S3-WROOM-1/1U/2)
;   Flash: 8 MB Quad   |   PSRAM: 8 MB Octal
;   I2C : SDA=GPIO7  SCL=GPIO6
;   LEDs: STRIP1=GPIO18  STRIP2=GPIO17   (Config.h defaults, no overrides needed)
; ============================================================================
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.psram_type = opi
build_flags =
    -DBOARD_HAS_PSRAM
    ; Route `Serial` to the native USB-CDC port (the connector labelled "USB").
    ; Set this to 0 (or remove) if you instead use the "UART" bridge port.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    

; ============================================================================
; ORIGINAL BOARD — ESP32 WROOM (Freenove / generic esp32dev)
;   I2C : SDA=GPIO21 SCL=GPIO22
;   LEDs: STRIP1=GPIO18  STRIP2=GPIO19
;   GPIO6/7 are flash pins on the classic ESP32, so the pins are overridden
;   here via build flags (Config.h picks these up through its #ifndef guards).
; ============================================================================
[env:esp32dev]
platform = espressif32
board = esp32dev
build_flags =
    -DBOARD_TYPE=\"ESP32_WROOM\"

; ============================================================================
; HOST TESTS — no hardware required
;   pio test -e native
;   Board profiles are plain data, so the registry, the fallback behaviour and
;   the INFO line the Pi parses can all be checked on a laptop. The test source
;   includes the needed .cpp directly; nothing from src/ is compiled wholesale
;   (main.cpp and the controllers are Arduino-only).
; ============================================================================
[env:native]
platform = native
framework =
lib_deps =
test_framework = unity
build_flags =
    -std=gnu++17
    -Iinclude
    -Itest/native_shims
