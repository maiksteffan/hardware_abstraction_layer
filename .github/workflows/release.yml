name: Build & Release Firmware

# Build the firmware and publish a flashable, merged binary whenever a semver
# tag is pushed. The Raspberry Pi downloads this `firmware-merged.bin` asset and
# flashes the ESP32 over USB with esptool (see the backend's
# firmware_update_service). The merged image is based at 0x0, so the Pi can flash
# it with `write_flash 0x0` regardless of the board (ESP32 WROOM or ESP32-S3).

on:
  push:
    tags:
      - 'v*.*.*'
      - '[0-9]*.*.*'

permissions:
  contents: write

# PlatformIO env to build for the release. The deployed boards are classic
# ESP32 (WROOM), so build esp32dev — NOT the platformio.ini default (which is
# the ESP32-S3 dev env used for local work).
env:
  PIO_ENV: esp32dev

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO & esptool
        run: pip install platformio "esptool<5"

      - name: Verify FIRMWARE_VERSION matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FW="$(grep -oP '#define\s+FIRMWARE_VERSION\s+"\K[^"]+' include/Config.h)"
          echo "Tag version:      $TAG"
          echo "Firmware version: $FW"
          if [ "$TAG" != "$FW" ]; then
            echo "::error::FIRMWARE_VERSION ($FW) in include/Config.h does not match tag ($TAG). Bump Config.h before tagging."
            exit 1
          fi

      - name: Build firmware ($PIO_ENV)
        run: pio run -e "$PIO_ENV"

      - name: Merge into a single flashable binary
        run: |
          set -euo pipefail
          BUILD_DIR=".pio/build/$PIO_ENV/"
          ENV="$PIO_ENV"
          echo "Build dir: $BUILD_DIR (env: $ENV)"
          ls -la "$BUILD_DIR"
          # Derive the chip family from the env name so the bootloader offset is
          # correct (esp32-s3-devkitc-1 -> esp32s3 @ 0x0, esp32dev -> esp32 @ 0x1000).
          case "$ENV" in
            *s3*) CHIP=esp32s3 ;;
            *s2*) CHIP=esp32s2 ;;
            *c3*) CHIP=esp32c3 ;;
            *c6*) CHIP=esp32c6 ;;
            *h2*) CHIP=esp32h2 ;;
            *)    CHIP=esp32 ;;
          esac
          echo "Chip: $CHIP"
          python .github/scripts/merge_firmware.py "$BUILD_DIR" firmware-merged.bin "$CHIP"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: firmware-merged.bin
          generate_release_notes: true
